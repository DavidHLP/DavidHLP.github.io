name: Astro blog
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npm run check:content
      - run: npm run check:viewport
      - run: npm run kb:lint
      - run: npm run test:kb
      - name: Install browser verification tools
        run: |
          npm install --prefix "$RUNNER_TEMP/about-browser-tools" --package-lock=false --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/about-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify About pages in a browser
        run: node scripts/check-about-browser.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/about-browser-tools/node_modules/playwright/index.mjs
      - name: Save About verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-pdf-browser-evidence
          path: .reports/about-browser/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
