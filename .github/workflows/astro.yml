name: Astro blog
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RHINE_RESUME_PDF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils pandoc texlive-xetex texlive-lang-chinese texlive-fonts-recommended lmodern fonts-noto-core fonts-noto-cjk
      - run: npm run build:cloudflare
      - run: npm run check:content
      - run: npm run check:viewport
      - run: npm run kb:lint
      - run: npm run test:kb
      - name: Install browser verification tools
        run: npm install --no-save --package-lock=false playwright@1.62.1 && npx playwright install --with-deps chromium
      - name: Verify all About PDFs and browser views
        run: node scripts/check-about-browser.mjs
      - name: Save About verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: about-pdf-browser-evidence
          path: .reports/about-browser/
          if-no-files-found: warn
          retention-days: 14
