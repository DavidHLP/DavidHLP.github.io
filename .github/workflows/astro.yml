name: Astro blog
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RHINE_RESUME_PDF: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils pandoc texlive-xetex texlive-lang-chinese texlive-fonts-recommended lmodern fonts-noto-core fonts-noto-cjk
      - run: npm run build:cloudflare
      - run: npm run check:content
      - run: npm run check:viewport
      - run: npm run kb:lint
      - run: npm run test:kb
