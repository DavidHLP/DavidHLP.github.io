name: Site validation

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Prepare validation output
        run: mkdir -p "$RUNNER_TEMP/site-validation"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Run Biome checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec biome ci

      - name: Astro type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm check

      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test:run --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/site-validation/unit-tests.json"

      - name: Build Astro site
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm build

      - name: Validate Rhine archive data and resources
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/editorial-smoke.mjs

      # The project's locked Biome 2.4.2 does not check standalone SVG files.
      # Use an isolated, pinned SVG-capable CLI without changing project dependencies.
      - name: Check committed SVG accessibility and formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/svg-tools" --no-save --ignore-scripts @biomejs/biome@2.5.12
          "$RUNNER_TEMP/svg-tools/node_modules/.bin/biome" check --config-path "$GITHUB_WORKSPACE" public/favicon.svg src/icons/site-logo.svg

      - name: Install isolated browser validation tools
        id: browser
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          npm install --prefix "$RUNNER_TEMP/about-browser" --no-save --ignore-scripts playwright@1.63.0
          node "$RUNNER_TEMP/about-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: About page browser and print smoke test
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        run: |
          pnpm preview --host 127.0.0.1 --port 4321 > "$RUNNER_TEMP/site-validation/preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs/promises');
          const { chromium } = require(`${process.env.RUNNER_TEMP}/about-browser/node_modules/playwright`);
          const base = 'http://127.0.0.1:4321';
          const output = `${process.env.RUNNER_TEMP}/site-validation`;
          (async () => {
            let ready = false;
            let lastResponse = 'not started';
            for (let i = 0; i < 60; i++) {
              try {
                const response = await fetch(`${base}/about`);
                lastResponse = `${response.status} ${response.url}`;
                if (response.ok) { ready = true; break; }
              } catch (error) { lastResponse = String(error); }
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            assert.ok(ready, `Astro preview did not become ready: ${lastResponse}`);
            const browser = await chromium.launch();
            const errors = [];
            const reports = [];
            try {
              const page = await browser.newPage();
              page.on('pageerror', error => errors.push(String(error)));
              for (const width of [375, 768, 1440]) {
                await page.setViewportSize({ width, height: 1000 });
                const response = await page.goto(`${base}/about`, { waitUntil: 'networkidle' });
                assert.equal(response.status(), 200);
                await page.evaluate(() => document.fonts.ready);
                const resume = page.locator('main article .markdown').first();
                assert.equal(await resume.locator('h1').innerText(), '贺恋棚');
                assert.equal(await resume.locator('h2').count(), 5);
                const text = await resume.innerText();
                for (const term of ['博彦科技', 'UltiCode', 'ResiCache', 'codebase-memory-mcp']) {
                  assert.ok(text.includes(term), `Missing resume content: ${term}`);
                }
                assert.ok(text.indexOf('UltiCode') < text.indexOf('ResiCache'));
                const size = await page.evaluate(() => ({ viewport: innerWidth, content: document.documentElement.scrollWidth }));
                const clippedText = await resume.evaluate(root => {
                  const clipped = [];
                  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                  let node;
                  while ((node = walker.nextNode())) {
                    if (!node.textContent.trim()) continue;
                    const range = document.createRange();
                    range.selectNodeContents(node);
                    if ([...range.getClientRects()].some(rect => rect.width > 0 && (rect.left < -1 || rect.right > innerWidth + 1))) {
                      clipped.push(node.textContent.slice(0, 80));
                    }
                  }
                  return clipped;
                });
                reports.push({ width, ...size, clippedText });
                await page.screenshot({ path: `${output}/about-${width}.png`, fullPage: true });
                assert.ok(size.content <= size.viewport + 1, `Horizontal overflow at ${width}px: ${size.content}`);
                assert.deepEqual(clippedText, [], `Clipped resume text at ${width}px`);
              }
              await page.locator('#theme-toggle').click();
              await page.waitForFunction(() => document.documentElement.dataset.theme === 'dark');
              await page.screenshot({ path: `${output}/about-dark.png`, fullPage: true, animations: 'disabled' });
              await page.emulateMedia({ media: 'print' });
              await page.pdf({ path: `${output}/about.pdf`, format: 'A4', printBackground: true, preferCSSPageSize: true });
              const print = await page.locator('.no-print').evaluateAll(elements => elements.map(element => getComputedStyle(element).display));
              assert.ok(print.every(display => display === 'none'), 'Print-only exclusions are visible');
              const colors = await page.locator('[data-resume-page] article .markdown').first().locator('h1, h2, h3, p, li, a, strong, code').evaluateAll(elements => [...new Set(elements.map(element => getComputedStyle(element).color))]);
              assert.deepEqual(colors, ['rgb(17, 17, 17)'], 'Dark theme produces low-contrast print text');
              assert.deepEqual(errors, [], 'Browser runtime errors');
              const report = { reports, browserErrors: errors, print: 'passed', printTextColors: colors };
              console.log(JSON.stringify(report, null, 2));
              await fs.writeFile(`${output}/browser-report.json`, JSON.stringify(report, null, 2));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Upload validation evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: site-validation-${{ github.run_id }}
          path: ${{ runner.temp }}/site-validation/
          retention-days: 7
          if-no-files-found: error
