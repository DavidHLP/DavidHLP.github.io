name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug!
        Please fill out the following information to help diagnose and fix the issue.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting
      options:
        - label: I have searched existing issues and this bug has not been reported
          required: true
        - label: I am using the latest code from the branch
          required: true

  - type: dropdown
    id: branch
    attributes:
      label: Branch
      description: Which branch are you using?
      options:
        - main
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description & Reproduction
      description: What happened?
      placeholder: |
        Describe the bug clearly.

        Steps:
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected to happen.
    validations:
      required: false

  - type: textarea
    id: envinfo
    attributes:
      label: Environment Information
      description: Run `npx astro info` to get the environment details, and include your browser.
      placeholder: |
        Astro             ...
        Node              ... (22.12 or newer)
        System            ...
        Package Manager   ... (npm)
        Output            ...
        Adapter           ...
        Integrations      ...
        Browser           ... (name and version)
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Would you be willing to help fix this bug?
      options:
        - label: I am willing to submit a PR to fix this bug
