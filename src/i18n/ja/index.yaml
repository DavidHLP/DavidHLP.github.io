engineering:
  folio: ENGINEERING NOTES / SELECTED WORK
  statement: 複雑な問題を、確かな仕組みに。
  intro: Java バックエンド、並行処理、障害時の境界。オープンソースで実装し、技術ノートで説明します。
  resume: 履歴書を読む
  projectsLabel: 01 / SELECTED SYSTEMS
  projectsTitle: 問題から、実装へ。
  projectsIntro: 2 つの個人開発プロジェクトから、設計上の課題を紹介します。
  source: ソースコード
  explore: 設計上の判断を読む
