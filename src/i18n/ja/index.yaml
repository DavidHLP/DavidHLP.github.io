  contents: 履歴書の目次
  resumeLabel: CURRICULUM VITAE / ENGINEERING
  resumeNote: 経験、実装、そして根拠。
  readingLabel: 02 / FIELD NOTES
  readingTitle: 調査の知識を、再利用できる形に。
  readingIntro: 結論だけでなく、現象・根拠・判断を記録します。
  imageAlt: 炭黒と赤の網点で描かれた帆船が水面を進む、余白を生かした文字のない図版
  evidence:
    - label: EXPERIENCE
      title: ホストセキュリティ · クラウド
      text: 博彦科技インターン / Alibaba Cloud 専有クラウド案件
    - label: PRACTICE
      title: 並行処理 · 整合性 · 隔離
      text: ResiCache / UltiCode 個人開発
    - label: METHOD
      title: 観測 → 特定 → 検証
      text: Arthas / SQL 実行計画 / コンテナ調査
  projects:
    - name: ResiCache
      category: CACHE COORDINATION
      title: 同じキーへのリクエストを、一つの処理に。
      description: リクエストの集約、バージョン付き期限管理、障害時の動作を扱う Spring Cache 拡張。
      stack: Java 21 / Spring Cache / Redis
      flow: [Concurrent requests, Shared future, One loader]
      question: 古い非同期タスクが新しい値の TTL を変更しないためには？
      answer: Redis Lua で値のバージョンを原子的に確認してから TTL を短縮します。期限切れ後のリクエストがロードを開始し、新しい値を古いタスクから保護します。
      url: https://github.com/DavidHLP/ResiCache
    - name: UltiCode
      category: RELIABLE EXECUTION
      title: すべての実行に、明確な境界を。
      description: Outbox、タスク回収、実行世代の管理で配送失敗・重複実行・再判定の競合を扱う個人開発のオンラインジャッジ。
      stack: Java 17 / Redis Streams / Docker
      flow: [Submission, Outbox → Stream, Judge worker]
      question: 再判定の開始後、古い実行結果をどう拒否する？
      answer: generation と attemptId で有効な実行を識別し、リースとハートビートを併用します。二条件の SQL CAS により古い実行結果の書き込みを拒否します。
      url: https://github.com/DavidHLP/UltiCode
  readings:
    - title: Java 本番環境の性能調査
      description: 現象から根拠へ進む最小の判断ツリー · 中国語
      path: /note/java-online-performance-debug
      tag: JVM / OBSERVABILITY
    - title: containerd TLS 調査
      description: 証明書の信頼チェーンと段階的な診断 · 中国語
      path: /note/containerd-tls-troubleshooting
      tag: CONTAINERS / SECURITY
