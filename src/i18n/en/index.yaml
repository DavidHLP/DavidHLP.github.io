    highlights:
      - "<strong>Beyondsoft · Backend Intern (Jan–Jun 2026)</strong>: Worked on Alibaba Cloud's private-cloud Aegis project: GPU resource integration, AI asset identification, SQL optimization, and diagnostics with Arthas, containerd and Harbor."
      - "<strong>ResiCache</strong>: Implemented single-flight request coalescing, distributed loading coordination, version-checked early expiration with Lua, and guarded deserialization; verified failures and races with concurrency and Redis integration tests."
