  resumeNote: Experience, implementation, evidence.
  readingLabel: 02 / FIELD NOTES
  readingTitle: Make debugging knowledge reusable.
  readingIntro: Symptoms, evidence and decisions — beyond the final answer.
  imageAlt: A charcoal and red halftone sailboat crossing open water, with generous white space and no text
  evidence:
    - label: EXPERIENCE
      title: Host security · Cloud resources
      text: Beyondsoft internship / Alibaba Cloud private-cloud security project
    - label: PRACTICE
      title: Concurrency · Consistency · Isolation
      text: ResiCache / UltiCode personal open-source work
    - label: METHOD
      title: Observe → Diagnose → Verify
      text: Arthas / SQL execution plans / Container debugging
  projects:
    - name: ResiCache
      category: CACHE COORDINATION
      title: The same key needs only one load.
      description: A Spring Cache resilience extension exploring request coalescing, versioned expiration and failure semantics.
      stack: Java 21 / Spring Cache / Redis
      flow: [Concurrent requests, Shared future, One loader]
      question: Can an old async task change a new value’s TTL?
      answer: Redis Lua atomically checks the cached value’s version before shortening its TTL. Later requests trigger loading after expiry, protecting newer values from stale tasks.
      url: https://github.com/DavidHLP/ResiCache
    - name: UltiCode
      category: RELIABLE EXECUTION
      title: Every execution has a boundary.
      description: A personal online judge using transactional Outbox, task recovery and execution generations to handle delivery failures, duplicates and rejudge races.
      stack: Java 17 / Redis Streams / Docker
      flow: [Submission, Outbox → Stream, Judge worker]
      question: How do you reject a late result after a rejudge starts?
      answer: A generation and attemptId identify the valid execution, with leases and heartbeats. A dual-condition SQL CAS rejects results from outdated executions.
      url: https://github.com/DavidHLP/UltiCode
  readings:
    - title: Java production debugging
      description: A minimal decision tree from symptoms to evidence · Chinese
      path: /note/java-online-performance-debug
      tag: JVM / OBSERVABILITY
    - title: containerd TLS debugging
      description: Certificate trust chains and layered diagnosis · Chinese
      path: /note/containerd-tls-troubleshooting
      tag: CONTAINERS / SECURITY
